name: CI

on:
  push:
    branches: [main, production-refactor]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d ci_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # DATABASE_URL is required for app.db.database to import at all (its
      # engine is created at module import time). TEST_DATABASE_URL is the
      # separate, explicit opt-in conftest.py requires before running any
      # test - see tests/conftest.py. Both point at the same disposable
      # service container here, which is safe specifically because this
      # container never holds anything but CI throwaway data.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_test_db
      TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_test_db
      # JWT_SECRET_KEY has no default (see app/core/config.py) - app.main
      # refuses to import without one, so CI needs a real-length value
      # even though it's throwaway and never used to authenticate anything real.
      JWT_SECRET_KEY: ci-only-secret-not-for-real-use-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest
