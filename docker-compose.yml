services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: predictive_maintenance_backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    dns:
      - 8.8.8.8
      - 1.1.1.1

    environment:
      DATABASE_URL: ${DATABASE_URL}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile

    container_name: predictive_maintenance_dashboard

    restart: unless-stopped

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      - backend
